<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>

  <!-- Partie gauche : mockup niveau 1 -->
  <rect x="30" y="30" width="330" height="500" rx="14" fill="#0f3d3e"/>
  <text x="195" y="70" text-anchor="middle" font-size="13" fill="#c9dedd">Vue instantanée — S28 à S31</text>

  <text x="195" y="220" text-anchor="middle" font-size="64" font-weight="800" fill="#5fd39a">94%</text>
  <text x="195" y="255" text-anchor="middle" font-size="14" fill="#e7f3f1">traités dans les délais</text>

  <rect x="70" y="290" width="250" height="36" rx="18" fill="#5fd39a" fill-opacity="0.15"/>
  <circle cx="90" cy="308" r="6" fill="#5fd39a"/>
  <text x="105" y="313" font-size="12" fill="#5fd39a">Tout va bien — rien à signaler</text>

  <text x="195" y="380" text-anchor="middle" font-size="11" fill="#8ab4b0">1 284 traités · 76 hors-SLA</text>

  <line x1="70" y1="420" x2="320" y2="420" stroke="#1c5a5c" stroke-width="1"/>
  <text x="195" y="450" text-anchor="middle" font-size="12" fill="#e0b84a" text-decoration="underline">Voir le détail →</text>

  <text x="195" y="500" text-anchor="middle" font-size="10" fill="#5a8582">Lecture : moins de 20 secondes</text>

  <!-- Partie droite : escalier des 6 niveaux -->
  <text x="640" y="55" text-anchor="middle" font-size="14" font-weight="700" fill="#1a202c">Les 6 niveaux de profondeur</text>

  <!-- niveau 1 -->
  <rect x="420" y="75" width="440" height="50" rx="8" fill="#0f3d3e"/>
  <text x="436" y="105" font-size="12" font-weight="700" fill="#ffffff">1 · Instantané</text>
  <text x="700" y="105" text-anchor="end" font-size="11" fill="#c9dedd">1 chiffre · &lt; 20 sec</text>

  <!-- niveau 2 -->
  <rect x="440" y="135" width="420" height="50" rx="8" fill="#1c5a5c"/>
  <text x="456" y="165" font-size="12" font-weight="700" fill="#ffffff">2 · Grands axes</text>
  <text x="700" y="165" text-anchor="end" font-size="11" fill="#d3e6e4">Appels / Tickets / Mails</text>

  <!-- niveau 3 -->
  <rect x="460" y="195" width="400" height="50" rx="8" fill="#2c7873"/>
  <text x="476" y="225" font-size="12" font-weight="700" fill="#ffffff">3 · Par groupe / manager</text>
  <text x="700" y="225" text-anchor="end" font-size="11" fill="#d3e6e4">Ex. Admilson RAMOS MIRANDA</text>

  <!-- niveau 4 -->
  <rect x="480" y="255" width="380" height="50" rx="8" fill="#3d9188"/>
  <text x="496" y="285" font-size="12" font-weight="700" fill="#ffffff">4 · Par technicien</text>
  <text x="700" y="285" text-anchor="end" font-size="11" fill="#e3f0ee">Ex. Alexandre HERTOUT</text>

  <!-- niveau 5 -->
  <rect x="500" y="315" width="360" height="50" rx="8" fill="#5aab9e"/>
  <text x="516" y="345" font-size="12" font-weight="700" fill="#0f3d3e">5 · Par semaine</text>
  <text x="700" y="345" text-anchor="end" font-size="11" fill="#0f3d3e">S28 → S31, tendance</text>

  <!-- niveau 6 -->
  <rect x="520" y="375" width="340" height="60" rx="8" fill="#e0b84a"/>
  <text x="536" y="400" font-size="12" font-weight="700" fill="#3a2c05">6 · Détail complet</text>
  <text x="536" y="418" font-size="11" fill="#3a2c05">Table technicien × semaine (= capture fournie)</text>

  <!-- flèches de descente -->
  <path d="M640,125 L640,135" stroke="#8ab4b0" stroke-width="2" marker-end="url(#a1)"/>
  <path d="M650,185 L650,195" stroke="#8ab4b0" stroke-width="2" marker-end="url(#a1)"/>
  <path d="M660,245 L660,255" stroke="#8ab4b0" stroke-width="2" marker-end="url(#a1)"/>
  <path d="M670,305 L670,315" stroke="#8ab4b0" stroke-width="2" marker-end="url(#a1)"/>
  <path d="M680,365 L680,375" stroke="#8ab4b0" stroke-width="2" marker-end="url(#a1)"/>

  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L5,9 L10,0 z" fill="#8ab4b0"/>
    </marker>
  </defs>

  <text x="640" y="465" font-size="10" fill="#718096">Chaque flèche = un clic sur un chiffre du niveau précédent</text>
  <text x="640" y="482" font-size="10" fill="#718096">(pas de nouvelle recherche à relancer)</text>
</svg>
