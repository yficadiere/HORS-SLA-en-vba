<svg viewBox="0 0 420 900" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <style>
      .label { font-size: 11px; fill: #5a6b6b; }
      .value { font-size: 13px; fill: #1c2b2b; }
      .h1 { font-size: 16px; font-weight: 700; fill: #0f3d3e; }
      .h2 { font-size: 13px; font-weight: 600; fill: #0f3d3e; }
    </style>
  </defs>

  <rect width="420" height="900" fill="#f7f9f8"/>

  <!-- Barre de titre du volet -->
  <rect x="0" y="0" width="420" height="46" fill="#0f3d3e"/>
  <text x="18" y="29" font-size="15" font-weight="700" fill="#ffffff">SLA Guard — Configuration</text>
  <circle cx="392" cy="23" r="10" fill="#1c5a5c"/>
  <text x="392" y="27" text-anchor="middle" font-size="12" fill="#ffffff">⚙</text>

  <!-- Bloc configuration rapide (CTA primaire) -->
  <rect x="16" y="62" width="388" height="150" rx="12" fill="#0f3d3e"/>
  <text x="34" y="92" font-size="15" font-weight="700" fill="#ffffff">Configuration rapide</text>
  <text x="34" y="112" font-size="11" fill="#c9dedd">Prêt en moins d'1 minute — sans champ à remplir</text>

  <rect x="34" y="126" width="352" height="30" rx="6" fill="#ffffff" fill-opacity="0.12" stroke="#e0b84a" stroke-width="1.5"/>
  <circle cx="50" cy="141" r="5" fill="#e0b84a"/>
  <text x="64" y="145" font-size="12" fill="#ffffff">Helpdesk standard — SLA 4h</text>

  <rect x="34" y="162" width="352" height="30" rx="6" fill="#ffffff" fill-opacity="0.06"/>
  <circle cx="50" cy="177" r="5" fill="none" stroke="#c9dedd" stroke-width="1.5"/>
  <text x="64" y="181" font-size="12" fill="#c9dedd">Support N2 — SLA 24h</text>

  <text x="34" y="204" font-size="11" fill="#e0b84a">→ 1 284 éléments détectés (30 derniers jours)</text>

  <text x="404" y="228" text-anchor="end" font-size="11" fill="#5a6b6b" text-decoration="underline">Configuration avancée</text>

  <!-- Section Sources -->
  <rect x="16" y="244" width="388" height="86" rx="10" fill="#ffffff" stroke="#e1e6e5" stroke-width="1"/>
  <text x="32" y="266" class="h2">▾ Sources</text>
  <text x="32" y="286" class="label">BAL surveillée</text>
  <text x="220" y="286" class="value" text-anchor="end">support-technique@entreprise.fr</text>
  <text x="32" y="306" class="label">Dossiers exclus</text>
  <text x="380" y="306" class="value" text-anchor="end">Corbeille, Brouillons</text>

  <!-- Section Seuils SLA -->
  <rect x="16" y="340" width="388" height="86" rx="10" fill="#ffffff" stroke="#e1e6e5" stroke-width="1"/>
  <text x="32" y="362" class="h2">▾ Seuils SLA</text>
  <text x="32" y="382" class="label">Incidents critiques</text>
  <text x="380" y="382" class="value" text-anchor="end">2h ouvrées</text>
  <text x="32" y="402" class="label">Incidents standards</text>
  <text x="380" y="402" class="value" text-anchor="end">4h ouvrées</text>

  <!-- Section Sécurité & confidentialité -->
  <rect x="16" y="436" width="388" height="150" rx="10" fill="#ffffff" stroke="#e1e6e5" stroke-width="1"/>
  <text x="32" y="458" class="h2">▾ Sécurité &amp; confidentialité</text>

  <rect x="32" y="470" width="356" height="32" rx="6" fill="#eef6f0"/>
  <text x="44" y="491" font-size="11" fill="#1c6b3a">🔒  Lecture seule — aucune modification, aucune suppression</text>

  <rect x="32" y="508" width="356" height="32" rx="6" fill="#eef6f0"/>
  <text x="44" y="529" font-size="11" fill="#1c6b3a">🔒  Aucune donnée envoyée hors de ce poste</text>

  <text x="32" y="560" class="label">Anonymiser les techniciens à l'export</text>
  <rect x="356" y="548" width="32" height="16" rx="8" fill="#d8dfde"/>
  <circle cx="364" cy="556" r="6" fill="#ffffff"/>

  <text x="32" y="578" font-size="10" fill="#8a9998" text-decoration="underline">Voir le détail technique →</text>

  <!-- Section Aperçu graphique -->
  <rect x="16" y="596" width="388" height="140" rx="10" fill="#ffffff" stroke="#e1e6e5" stroke-width="1"/>
  <text x="32" y="618" class="h2">▾ Aperçu — répartition des incidents</text>

  <rect x="32" y="632" width="180" height="14" rx="3" fill="#0f3d3e"/>
  <text x="220" y="643" font-size="10" fill="#5a6b6b">Accès (42%)</text>
  <rect x="32" y="654" width="120" height="14" rx="3" fill="#1c6b6c"/>
  <text x="160" y="665" font-size="10" fill="#5a6b6b">Messagerie (28%)</text>
  <rect x="32" y="676" width="90" height="14" rx="3" fill="#e0b84a"/>
  <text x="130" y="687" font-size="10" fill="#5a6b6b">Matériel (21%)</text>
  <rect x="32" y="698" width="42" height="14" rx="3" fill="#c94f4f"/>
  <text x="82" y="709" font-size="10" fill="#5a6b6b">Autres (9%)</text>

  <!-- Bandeau gain de temps -->
  <rect x="16" y="752" width="388" height="70" rx="10" fill="#fff8e8" stroke="#e0b84a" stroke-width="1.2"/>
  <text x="32" y="778" font-size="12" font-weight="700" fill="#8a6a1a">⏱  Temps estimé économisé ce mois-ci</text>
  <text x="32" y="800" font-size="20" font-weight="700" fill="#0f3d3e">3h 40min</text>
  <text x="220" y="800" font-size="10" fill="#8a6a1a" text-anchor="end">vs. tri manuel équivalent</text>

  <!-- Actions bas de volet -->
  <rect x="16" y="838" width="184" height="42" rx="8" fill="#e0b84a"/>
  <text x="108" y="864" text-anchor="middle" font-size="13" font-weight="700" fill="#3a2c05">Enregistrer</text>

  <rect x="212" y="838" width="192" height="42" rx="8" fill="none" stroke="#c8d2d1" stroke-width="1.5"/>
  <text x="308" y="864" text-anchor="middle" font-size="13" fill="#5a6b6b">Exporter le template</text>
</svg>
